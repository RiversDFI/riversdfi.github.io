<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Dawson's Awesome</title>
    
    <style>
        body {
            background: linear-gradient(to bottom, rgba(204, 102, 0, 0) , rgba(204, 102, 0, 1) 70%);
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            margin: 0;
        }

        .top-logo-container {
             display: flex;
             justify-content: center;
            padding-top: 5px;
            width: 100%;
        }

        .top-logo {
            width: 800px;           
            height: 200px;          
            border: 10px solid hwb(0 100% 0%);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        nav {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            width: 100%;
        }
        
        nav ul {
            display: flex;
            list-style: none;
            justify-content: center;
            width: 30%;
            gap: 8rem;
            padding: 12px 40px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin: 0;
        }

        nav a {
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            opacity: 0.8;
            transition: 0.3s;
        }

        nav a:hover { opacity: 1; }

        /* --- Shop Page Content --- */

        main {
            padding: 60px 8%;
            text-align: center;
        }

        .shop-header {
            margin-bottom: 50px;
        }

        .shop-header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .product-card img {
            width: 100%;
            max-width: 200px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        }

        .product-card h3 {
            margin: 10px 0;
            font-size: 1.4rem;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffcaad;
            margin-bottom: 20px;
        }

        .add-btn {
            background: #fff;
            color: #914002;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        .add-btn:hover {
            background: #f0f0f0;
            transform: scale(1.02);
        }

        footer {
            text-align: center;
            padding: 60px 40px;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        @media (max-width: 768px) {
            .top-logo { width: 90%; height: auto; }
            nav ul { width: 90%; gap: 2rem; padding: 12px 20px; }
            .product-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="top-logo-container">
        <a href="index.html">
            <img src="Riv Banner Website.jpg" alt="Dawson's Logo" class="top-logo">
        </a>
    </div>

    <nav>
        <ul>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="story.html">Story</a></li>
        </ul>
    </nav>

    <main>
        <div class="shop-header">
            <h1>The Lineup</h1>
            <p>TBD</p>
        </div>

        <div class="product-grid">
            <div class="product-card">
                <img src="Transparent Sauce.png" alt="Dawson's Original Hot Sauce">
                <h3>[Original Grillin Sauce](http://googleusercontent.com/shopping_content/1_link)</h3>
                <p>Tangy, rich, and smooth.</p>
                <div class="product-price">$12.00</div>
                <button class="add-btn">Add to Cart</button>
            </div>


        </div>
    </main>

    <footer>
        <p>&copy; 2026 Dawson's Awesome. All Rights Reserved.</p>
    </footer>

<script src="script.js"></script>
</body>
</html>
